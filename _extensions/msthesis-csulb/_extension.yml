title: msthesis-csulb
author: Thomas Gredig
version: 0.1.1
quarto-required: ">=1.8.0"
contributes:
  formats:
    pdf:
      documentclass: msthesis-csulb
      format-resources: [msthesis-csulb.cls]
      template-partials: # pandoc
        - assets/before-body.tex
      toc: false
      toc-depth: 1
      keep-tex: true
      include-before-body: 
        - assets/definitions.tex
      include-in-header: 
        - assets/in-header.tex
      colorlinks: true
      citecolor: magenta
      linkcolor: blue
      urlcolor: red
      toclinkcolor: black
