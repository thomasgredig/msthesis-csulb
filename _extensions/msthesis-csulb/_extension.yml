title: M.S. thesis (csulb) pdf format template
author: Thomas Gredig
version: 0.2.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    common:
      titlepage: partials/titlepage.tex
    html: 
      css: msthesis-csulb.css
    pdf:
      documentclass: msthesis-csulb
      format-resources: 
        - msthesis-csulb.cls
        - partials/titlepage.tex
      template-partials: # pandoc
        - partials/before-body.tex
      toc: false # added in before-body.tex
      lof: false # added in before-body.tex
      lot: false
      toc-depth: 3
      keep-tex: true
      include-before-body: 
        - partials/definitions.tex
      include-in-header: 
        - partials/in-header.tex
      colorlinks: true
      citecolor: magenta
      linkcolor: blue
      urlcolor: red
      toclinkcolor: black

language:
  en:
    section-title-appendices: "APPENDIX"
    section-title-abstract: "ABSTRACT"
    # see https://github.com/quarto-dev/quarto-cli/blob/main/src/resources/language/_language.yml
       
resources:
  - physical-review-b.csl
  - partials/titlepage.tex

csl: physical-review-b.csl
